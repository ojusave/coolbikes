name: Capture README screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/readme-screenshots.yml
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture actual app pages without payment credentials
        run: |
          node src/index.js > /tmp/coolbikes.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';
          for (let n = 0; n < 30; n++) {
            try { const r = await fetch('http://127.0.0.1:4317'); if (r.ok) break; } catch {}
            await new Promise(r => setTimeout(r, 500));
          }
          await mkdir('docs/screenshots', { recursive: true });
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4317', { waitUntil: 'domcontentloaded' });
          await page.locator('#products a').first().waitFor();
          await page.evaluate(async () => { await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); });
          await page.screenshot({ path: 'docs/screenshots/catalog.png', fullPage: true });
          await page.locator('#products a').first().click();
          await page.getByText('This payments plug has no card form.', { exact: true }).waitFor();
          await page.evaluate(async () => { await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); });
          await page.screenshot({ path: 'docs/screenshots/checkout.png', fullPage: true });
          await browser.close();
          JS
      - name: Save screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/catalog.png docs/screenshots/checkout.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture catalog and unconfigured checkout for README"
          git push
