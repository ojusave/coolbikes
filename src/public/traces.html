<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traces · CoolBikesCo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shop.css">
  <style>
    body { background: #f4f0e8; }
    main { max-width: 880px; margin: 0 auto; padding: 84px 16px 72px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .lede { margin: 0 0 24px; }
    #empty { color: #4a433b; }
    .trace { background: #fffdf8; border: 1px solid #d9d0c3; border-radius: 12px; padding: 16px; margin: 0 0 14px; }
    h2 { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.95rem; margin: 0; overflow-wrap: anywhere; }
    .when { margin: 4px 0 14px; color: #4a433b; font-size: 0.9rem; }
    ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li { padding-left: calc((var(--depth) - 1) * 1.1rem); }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    .op { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.92rem; }
    .meta { color: #4a433b; white-space: nowrap; }
    li[data-outcome="error"] .meta { color: #8c2f2f; }
    .track { position: relative; height: 6px; margin-top: 6px; background: #e7e1d6; border-radius: 99px; }
    .bar { position: absolute; top: 0; height: 6px; border-radius: 99px; background: #0c5c48; }
    li[data-outcome="error"] .bar { background: #8c2f2f; }
    li[data-outcome="running"] .bar { width: 28%; animation: slide 1s ease-in-out infinite; }
    .fields { margin: 6px 0 0; color: #4a433b; font-size: 0.9rem; overflow-wrap: anywhere; }
    @keyframes slide { 50% { width: 70%; } }
    @media (prefers-reduced-motion: reduce) {
      li[data-outcome="running"] .bar { animation: none; width: 40%; }
    }
  </style>
</head>
<body>
  <header id="header">
    <div class="header-content">
      <a class="logo-link" href="/">CoolBikesCo</a>
    </div>
  </header>
  <main>
    <h1>API traces</h1>
    <p class="lede">Open a call to read its request and response.</p>
    <p id="empty">No API calls yet. Pay for a bike, and they will show up here.</p>
    <div id="traces"></div>
    <p id="live" role="status"></p>
  </main>
  <script src="/traces.js"></script>
</body>
</html>
