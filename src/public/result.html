<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment · CoolBikesCo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shop.css">
</head>
<body>
  <header id="header">
    <div class="header-content">
      <a class="logo-link" href="/">CoolBikesCo</a>
    </div>
  </header>
  <main class="page">
    <div class="status-container">
      <div class="status" id="status-card">
        <h1 class="status-title" id="title"></h1>
        <p class="status-message" id="message"></p>
        <div class="status-details" id="details" hidden>
          <div class="detail-item">
            <span class="detail-label">Order reference</span>
            <span class="detail-value" id="reference"></span>
          </div>
        </div>
        <div class="invoice" id="invoice" hidden>
          <div class="detail-item"><span class="detail-label">Bike</span><span class="detail-value" id="invoice-bike"></span></div>
          <div class="detail-item"><span class="detail-label">Amount</span><span class="detail-value" id="invoice-amount"></span></div>
          <div class="detail-item"><span class="detail-label">Payment</span><span class="detail-value" id="invoice-method"></span></div>
          <div class="detail-item"><span class="detail-label">PSP reference</span><span class="detail-value" id="invoice-psp"></span></div>
          <p class="status-message" id="invoice-note"></p>
          <button class="button" id="refund" type="button" hidden>Refund</button>
        </div>
        <div class="status-actions">
          <a class="button" id="home" href="/">Return to bikes</a>
          <a class="button secondary" id="again" href="/checkout" hidden>Try again</a>
        </div>
      </div>
    </div>
  </main>
  <script src="/result.js"></script>
</body>
</html>
