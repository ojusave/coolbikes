<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoolBikesCo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --paper: #f4f0e8;
      --card: #fffdf8;
      --line: #d9d0c3;
      --accent: #0c5c48;
      --muted: #4a433b;
      --bad: #8c2f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.45;
    }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px 72px; }
    .tools { margin: 0 0 20px; }
    .tools a { color: var(--muted); }
    h1 { font-size: 2.2rem; font-weight: 600; margin: 0 0 8px; }
    .lede { margin: 0 0 24px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    button.bike, button.pay { font: inherit; cursor: pointer; }
    button.bike {
      width: 100%;
      text-align: left;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    button.bike:focus-visible, button.pay:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.bike[aria-pressed="true"] { border-color: var(--accent); background: #e7f3ee; }
    .price { float: right; }
    .summary { display: block; margin-top: 6px; color: var(--muted); }
    button.pay {
      margin-top: 16px;
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      min-height: 44px;
    }
    button.pay:disabled { opacity: 0.45; cursor: not-allowed; }
    #checkout { margin-top: 28px; }
    h2 { font-size: 1.25rem; margin: 0 0 8px; }
    #status { margin: 8px 0 0; }
    #status[data-kind="error"] { color: var(--bad); }
    @media (max-width: 480px) {
      .price { float: none; display: block; margin-top: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="tools"><a href="/trace">Operations</a></p>
    <h1>CoolBikesCo</h1>
    <p class="lede">Bicycles from the Netherlands. Choose one, then pay.</p>
    <ul id="products"></ul>
    <button class="pay" id="pay" type="button" disabled>Select a bike</button>
    <section id="checkout" hidden>
      <h2>Checkout</h2>
      <div id="dropin"></div>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
