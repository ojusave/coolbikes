<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoolBikesCo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shop.css">
</head>
<body class="with-trace-dock">
  <header id="header">
    <div class="header-content">
      <a class="logo-link" href="/">CoolBikesCo</a>
    </div>
  </header>
  <main class="page">
    <p class="demo-intro">Choose a bike to check out.</p>
    <div class="homepage-cards" id="products"></div>
  </main>
  <aside class="live-panel is-docked" aria-label="API traces">
    <div class="live-head">
      <h2 class="live-title">API traces</h2>
      <p class="live-lede">Open a call to read its request and response.</p>
      <p id="empty">No API calls yet. Choose a bike and they will show up here.</p>
      <p id="live" role="status"></p>
    </div>
    <div id="traces"></div>
  </aside>
  <script src="/app.js"></script>
  <script src="/traces.js"></script>
</body>
</html>
